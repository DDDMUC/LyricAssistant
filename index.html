<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作词助手</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="titlebar" data-tauri-drag-region>
      <span class="titlebar-title" data-tauri-drag-region>作词助手</span>
      <button id="btn-theme" type="button" title="切换主题" aria-label="切换主题">☁️</button>
    </div>

    <div class="workspace">
      <aside class="sidebar">
        <div class="sidebar-head">
          <span class="brand-badge">作词助手</span>
          <button id="btn-sidebar" type="button" title="收起侧边栏" aria-label="收起侧边栏">
            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="1.6" y="2.6" width="12.8" height="10.8" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.4" />
              <rect x="3.4" y="4.4" width="3.1" height="7.2" rx="0.9" fill="currentColor" />
            </svg>
          </button>
        </div>
        <button id="btn-new-doc" class="new-doc" type="button" title="新建歌词文件" aria-label="新建歌词文件">＋ 新建歌词</button>
        <div id="doc-list" class="doc-list"></div>
      </aside>
      <div
        id="sidebar-resizer"
        class="sidebar-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="调整侧边栏宽度"
        title="拖动调整宽度（双击恢复默认）"
      ></div>

      <div class="main-col">
        <header class="topbar">
          <button id="btn-sidebar-expand" type="button" title="展开侧边栏" aria-label="展开侧边栏">
            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="1.6" y="2.6" width="12.8" height="10.8" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.4" />
              <rect x="3.4" y="4.4" width="3.1" height="7.2" rx="0.9" fill="currentColor" />
            </svg>
          </button>
          <div class="brand">
            <input id="project-title" class="title-input" value="未命名歌曲" aria-label="工程标题" />
            <button id="btn-credits" type="button" hidden title="查看 / 编辑创作信息">创作信息</button>
            <button id="btn-source" type="button" hidden title="查看 / 隐藏导入原文（用于核对）">原文</button>
          </div>
          <div class="topbar-actions">
            <label class="pattern-label">
              词格
              <input id="new-pattern" class="pattern-input" value="4/4" />
            </label>
            <button id="btn-import-lyrics" type="button">导入</button>
            <button id="btn-open" type="button">打开工程</button>
            <button id="btn-ai" type="button" aria-expanded="false">AI 填词</button>
            <div id="editor-actions" class="editor-actions">
              <button id="btn-add-sentence" type="button">新句</button>
              <button id="btn-reflow" type="button" hidden>整理溢出</button>
              <button id="btn-save" type="button">保存工程</button>
              <button id="btn-save-as" type="button">另存为</button>
              <span class="menu-wrap">
                <button id="btn-export" class="primary" type="button" aria-haspopup="true" aria-expanded="false" title="导出歌词 / 词格">导出</button>
                <div id="export-menu" class="export-menu" hidden>
                  <button id="menu-export-lyrics" type="button">歌词</button>
                  <button id="menu-export-grid" type="button">词格</button>
                  <button id="menu-export-midi" type="button">带歌词 MIDI</button>
                </div>
              </span>
              <span class="menu-wrap">
                <button id="btn-copy" type="button" aria-haspopup="true" aria-expanded="false" title="复制歌词 / 词格">复制</button>
                <div id="copy-menu" class="export-menu" hidden>
                  <button id="menu-copy-lyrics" type="button">歌词</button>
                  <button id="menu-copy-grid" type="button">词格</button>
                </div>
              </span>
              <button id="btn-undo" type="button">撤销</button>
              <button id="btn-redo" type="button">重做</button>
            </div>
          </div>
          <button id="btn-clear-all" class="danger" type="button" title="清空所有格子（韵辙、歌名、备注保留，可撤销）">清空</button>
          <div id="scroll-progress" class="scroll-progress" aria-hidden="true"></div>
        </header>

        <main id="sentences" class="sentences"></main>
      </div>
      <aside id="source-panel" class="source-panel" hidden>
        <div class="source-head">
          <span>导入原文（核对用）</span>
          <button id="btn-source-close" type="button" title="关闭">✕</button>
        </div>
        <textarea id="source-text" class="source-text" readonly spellcheck="false" placeholder="导入歌词后，原文会留在这里，方便核对"></textarea>
      </aside>
      <div id="ai-resizer" class="ai-resizer" role="separator" aria-orientation="vertical" aria-label="调整 AI 面板宽度" title="拖动调整宽度（双击恢复默认）" hidden></div>
      <aside id="ai-panel" class="ai-panel" hidden>
        <div class="ai-head">
          <span class="ai-title">AI 填词</span>
          <button id="btn-ai-prompt" type="button" title="看发给模型的提示词">提示词</button>
          <button id="btn-ai-settings" type="button" title="接口设置">⚙</button>
          <button id="btn-ai-clear" type="button" title="清空对话">清空</button>
          <button id="btn-ai-close" type="button" title="关闭" aria-label="关闭">✕</button>
        </div>
        <div id="ai-messages" class="ai-messages"></div>
        <div class="ai-tools">
          <button id="btn-ai-write-all" type="button" title="按当前词格写完整首">按词格写整首</button>
        </div>
        <div class="ai-composer">
          <textarea id="ai-input" rows="2" placeholder="说要求，比如：写一段古风，押江阳；或「第 3 句重写」"></textarea>
          <div class="ai-composer-foot">
            <button id="ai-scope-chip" class="ai-chip" type="button" title="生成范围"></button>
            <button id="ai-model-chip" class="ai-chip" type="button" title="选择模型"></button>
            <button id="ai-effort-chip" class="ai-chip" type="button" title="推理等级"></button>
            <button id="btn-ai-send" type="button" title="发送（Enter；生成中变成停止）">↑</button>
          </div>
        </div>
        <div id="ai-hint" class="ai-hint">已自动附上词格</div>
      </aside>
    </div>

    <footer class="statusbar">
      <span id="status-stats" class="status-stats"></span>
      <span id="status-hint">点格子输入 · Backspace 删当前格 · Alt+←/→ 整句挪动 · Ctrl/Cmd+S 保存 · Ctrl/Cmd+Z 撤销 · Shift+Cmd+Z 重做</span>
      <span class="status-right">
        <span id="status-rhyme"></span>
        <span id="status-path"></span>
        <span id="status-autosave"></span>
      </span>
    </footer>
  </body>
</html>
