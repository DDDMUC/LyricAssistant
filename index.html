<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作词助手</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- 共享图标定义：「拆出 / 放回」共用同一个方框（#ic-frame），只换箭头；线宽/尺寸走 .btn-icon 一处 -->
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
      <defs>
        <g id="ic-frame">
          <rect x="3" y="9" width="12" height="12" rx="2" />
        </g>
        <path id="ic-arrow-out" d="M10 14 21 3" />
        <path id="ic-arrow-out-head" d="M15 3h6v6" />
        <path id="ic-arrow-in" d="M21 3 12 12" />
        <path id="ic-arrow-in-head" d="M12 7v5h5" />
      </defs>
    </svg>

    <div class="titlebar" data-tauri-drag-region>
      <span class="titlebar-title" data-tauri-drag-region>作词助手</span>
      <div class="titlebar-controls">
        <button id="btn-settings" type="button" title="设置：外观 / AI / 数据 / 关于" aria-label="设置">⚙️</button>
        <button id="win-min" class="win-ctrl" type="button" title="最小化" aria-label="最小化">─</button>
        <button id="win-max" class="win-ctrl" type="button" title="最大化" aria-label="最大化">▢</button>
        <button id="win-close" class="win-ctrl close" type="button" title="关闭" aria-label="关闭">✕</button>
      </div>
    </div>

    <div class="workspace">
      <aside class="sidebar">
        <div class="sidebar-head">
          <span class="sidebar-head-actions">
            <button id="btn-docs-win" class="icon-btn" type="button" title="拆出为独立窗口" aria-label="拆出为独立窗口">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-frame" /><use href="#ic-arrow-out" /><use href="#ic-arrow-out-head" /></svg>
            </button>
            <button id="btn-docs-redock" class="icon-btn" type="button" title="放回主窗口" aria-label="放回主窗口" hidden>
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-frame" /><use href="#ic-arrow-in" /><use href="#ic-arrow-in-head" /></svg>
            </button>
            <button id="btn-sidebar" type="button" title="收起侧边栏" aria-label="收起侧边栏">
              <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
                <rect x="1.6" y="2.6" width="12.8" height="10.8" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.4" />
                <rect x="3.4" y="4.4" width="3.1" height="7.2" rx="0.9" fill="currentColor" />
              </svg>
            </button>
          </span>
        </div>
        <button id="btn-new-doc" class="new-doc" type="button" title="新建歌词文件" aria-label="新建歌词文件">＋ 新建歌词</button>
        <div class="work-head">
          <span>工作区</span>
          <button id="btn-new-convo" type="button" title="新建对话" aria-label="新建对话">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
              <path d="M8 12h8" />
              <path d="M12 8v8" />
            </svg>
          </button>
        </div>
        <div id="doc-list" class="doc-list"></div>
      </aside>
      <div
        id="sidebar-resizer"
        class="sidebar-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="调整侧边栏宽度"
        title="拖动调整宽度（双击恢复默认）"
      ></div>

      <div class="workbench">
        <header class="topbar">
          <button id="btn-sidebar-expand" type="button" title="展开侧边栏" aria-label="展开侧边栏">
            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
              <rect x="1.6" y="2.6" width="12.8" height="10.8" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.4" />
              <rect x="3.4" y="4.4" width="3.1" height="7.2" rx="0.9" fill="currentColor" />
            </svg>
          </button>
          <div class="brand">
            <input id="project-title" class="title-input" value="未命名歌曲" aria-label="工程标题" />
            <button id="btn-credits" type="button" hidden title="查看 / 编辑创作信息">创作信息</button>
            <button id="btn-source" type="button" hidden title="查看 / 隐藏导入原文（用于核对）">原文</button>
          </div>
          <div class="topbar-actions">
            <button id="btn-import-lyrics" type="button">导入</button>
            <button id="btn-open" type="button">打开工程</button>
            <div id="editor-actions" class="editor-actions">
              <button id="btn-reflow" type="button" hidden>整理溢出</button>
              <button id="btn-save" type="button">保存工程</button>
              <button id="btn-save-as" type="button">另存为</button>
              <span class="menu-wrap">
                <button id="btn-export" class="primary" type="button" aria-haspopup="true" aria-expanded="false" title="导出歌词 / 词格">导出</button>
                <div id="export-menu" class="export-menu" hidden>
                  <button id="menu-export-lyrics" type="button">歌词</button>
                  <button id="menu-export-grid" type="button">词格</button>
                  <button id="menu-export-midi" type="button">带歌词 MIDI</button>
                </div>
              </span>
              <span class="menu-wrap">
                <button id="btn-copy" type="button" aria-haspopup="true" aria-expanded="false" title="复制歌词 / 词格">复制</button>
                <div id="copy-menu" class="export-menu" hidden>
                  <button id="menu-copy-lyrics" type="button">歌词</button>
                  <button id="menu-copy-grid" type="button">词格</button>
                </div>
              </span>
              <button id="btn-find" type="button" title="查找 / 替换（Cmd/Ctrl+F）">查找</button>
              <button id="btn-undo" type="button">撤销</button>
              <button id="btn-redo" type="button">重做</button>
              <button id="btn-clear-all" class="danger" type="button" title="清空所有格子（韵辙、歌名、备注保留，可撤销）">清空</button>
            </div>
          </div>
          <span class="topbar-right">
            <button id="btn-help" type="button" title="帮助：使用说明 / 快捷键 / 导出诊断日志">帮助</button>
            <button id="btn-ai" type="button" aria-expanded="false">AI</button>
            <button id="btn-ai-redock-main" type="button" title="放回主窗口" aria-label="放回主窗口" hidden>
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-frame" /><use href="#ic-arrow-in" /><use href="#ic-arrow-in-head" /></svg>
              <span>AI</span>
            </button>
            <button id="btn-docs-redock-main" type="button" title="收回文档栏" aria-label="收回文档栏" hidden>
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-frame" /><use href="#ic-arrow-in" /><use href="#ic-arrow-in-head" /></svg>
              <span>收回</span>
            </button>
          </span>
          <div id="scroll-progress" class="scroll-progress" aria-hidden="true"></div>
        </header>

        <div class="workbench-body">
          <div class="main-col">
            <main id="sentences" class="sentences"></main>
          </div>
      <aside id="source-panel" class="source-panel" hidden>
        <div class="source-head">
          <span>原文</span>
          <button id="btn-source-close" type="button" title="关闭">✕</button>
        </div>
        <textarea id="source-text" class="source-text" readonly spellcheck="false" placeholder="导入歌词后，原文会留在这里，方便核对"></textarea>
      </aside>
      <div id="ai-resizer" class="ai-resizer" role="separator" aria-orientation="vertical" aria-label="调整 AI 面板宽度" title="拖动调整宽度（双击恢复默认）" hidden></div>
      <aside id="ai-panel" class="ai-panel" hidden>
        <div class="ai-head">
          <span id="ai-win-title" class="ai-win-title" hidden>AI 面板</span>
          <button id="btn-ai-expand" type="button" title="铺满工作区" aria-label="铺满工作区">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="15 3 21 3 21 9" />
              <polyline points="9 21 3 21 3 15" />
              <line x1="21" y1="3" x2="14.5" y2="9.5" />
              <line x1="3" y1="21" x2="9.5" y2="14.5" />
            </svg>
          </button>
          <button id="btn-ai-prompt" type="button" title="看发给模型的提示词">系统提示词</button>
          <button id="btn-ai-detach" class="icon-btn" type="button" title="拆出为独立窗口" aria-label="拆出为独立窗口">
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-frame" /><use href="#ic-arrow-out" /><use href="#ic-arrow-out-head" /></svg>
          </button>
          <button id="btn-ai-redock" class="icon-btn" type="button" title="放回主窗口" aria-label="放回主窗口" hidden>
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-frame" /><use href="#ic-arrow-in" /><use href="#ic-arrow-in-head" /></svg>
          </button>
          <button id="btn-ai-win-new" type="button" title="新建对话" hidden>＋ 新对话</button>
          <button id="btn-ai-win-close" type="button" title="隐藏窗口（AI 生成会继续）" aria-label="隐藏窗口（AI 生成会继续）" hidden>✕</button>
        </div>
        <div id="ai-messages" class="ai-messages"></div>
        <div class="ai-composer">
          <textarea id="ai-input" rows="2"></textarea>
          <div class="ai-composer-foot">
            <button id="ai-scope-chip" class="ai-chip" type="button" title="生成范围"></button>
            <button id="ai-model-chip" class="ai-chip" type="button" title="选择模型"></button>
            <button id="ai-effort-chip" class="ai-chip" type="button" title="推理等级"></button>
            <button id="btn-ai-send" type="button" title="发送（Enter；生成中变成停止）">↑</button>
          </div>
        </div>
        <div id="ai-hint" class="ai-hint">已自动附上词格</div>
      </aside>
        </div>
      </div>
    </div>

    <footer class="statusbar">
      <span id="status-stats" class="status-stats"></span>
      <span id="status-hint"></span>
      <span class="status-right">
        <span id="status-groups"></span>
        <span id="status-rhyme"></span>
        <span id="status-path"></span>
        <span id="status-autosave"></span>
      </span>
    </footer>

    <!-- 独立窗拖回主窗口时的停靠预览（磁吸高亮） -->
    <div id="docs-dock-preview" class="dock-preview dock-preview-left" hidden></div>
    <div id="ai-dock-preview" class="dock-preview dock-preview-right" hidden></div>
  </body>
</html>
